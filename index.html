<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scanner BR - Shopee</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --laranja: #EE4D2D; --laranja-2: #FF6A3D; --laranja-escuro: #C73A1E;
    --bg: #F4F4F5; --texto: #18181B; --texto-suave: #71717A;
    --sombra-lg: 0 10px 26px rgba(238,77,45,.22);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: #0B0B0C; color: var(--texto); font-size: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  header {
    background: linear-gradient(120deg, var(--laranja-2), var(--laranja) 50%, var(--laranja-escuro));
    color: #fff; padding: 18px 20px 14px; text-align: center;
  }
  header .marca { font-size: 17px; font-weight: 900; }
  header .sub { font-size: 12.5px; opacity: .95; margin-top: 3px; }
  main { padding: 16px; max-width: 480px; margin: 0 auto; }
  #leitor { border-radius: 14px; overflow: hidden; background: #111; min-height: 260px; }
  .dica { font-size: 12.5px; color: #A1A1AA; text-align: center; margin: 10px 0 0; }
  .contador-wrap {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #18181B; color: #fff; border-radius: 12px; padding: 12px; margin-top: 16px;
  }
  .contador { background: var(--laranja); font-weight: 800; font-size: 13px; padding: 3px 10px; border-radius: 20px; }
  .btn {
    width: 100%; border: none; border-radius: 14px; padding: 16px 18px; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: inherit; margin-top: 16px; min-height: 54px;
  }
  .btn-primario { background: linear-gradient(135deg, var(--laranja-2), var(--laranja)); color: #fff; box-shadow: var(--sombra-lg); }
  .btn-primario:active { transform: scale(.97); }
  .aviso-erro { display: none; background: #3F1D14; color: #FCA5A5; border-radius: 12px; padding: 12px 14px; font-size: 13px; margin-top: 14px; text-align: center; }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(10px); opacity: 0; pointer-events: none;
    background: #18181B; color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 13.5px; font-weight: 600;
    transition: opacity .2s, transform .2s; z-index: 60; max-width: 88%; text-align: center;
  }
  .toast.mostrar { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="marca">📦 Scanner de BR</div>
  <div class="sub">Aponte a câmera pro código de barras ou QR</div>
</header>

<main>
  <div id="leitor"></div>
  <p class="dica">Cada código lido é enviado automaticamente. Pode continuar bipando.</p>

  <div class="contador-wrap">
    <span>Enviados nesta sessão</span>
    <span class="contador" id="contador">0</span>
  </div>

  <div class="aviso-erro" id="avisoErro">Não conseguimos acessar a câmera. Feche esta aba e use "Digitar/colar" na tela anterior.</div>

  <button class="btn btn-primario" onclick="window.close()">Concluído, voltar</button>
</main>

<div class="toast" id="toast"></div>

<script>
  // ponytail: essa página só lê a câmera e devolve os códigos pra aba que abriu ela
  // (window.opener via postMessage) - não guarda nada, não fala com planilha nenhuma.
  // Existe separada do app principal só porque o Apps Script bloqueia getUserMedia
  // nas páginas que ele mesmo serve; aqui, sendo um site normal, a câmera funciona.
  var enviados = 0;
  var ultimoLido = { codigo: '', quando: 0 };

  function enviarParaOpener(codigo) {
    if (!window.opener) return;
    window.opener.postMessage({ tipo: 'br-scanner-codigo', codigo: codigo }, '*');
    enviados++;
    document.getElementById('contador').textContent = enviados;
    mostrarToast('Enviado: ' + codigo);
  }

  function aoLerCodigo(textoBruto) {
    var codigo = (textoBruto || '').trim().toUpperCase();
    var agora = Date.now();
    if (codigo === ultimoLido.codigo && (agora - ultimoLido.quando) < 2000) return;
    ultimoLido = { codigo: codigo, quando: agora };
    enviarParaOpener(codigo);
  }

  var toastTimer;
  function mostrarToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast mostrar';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('mostrar'); }, 1200);
  }

  var scanner = new Html5Qrcode('leitor');
  scanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 260, height: 150 } },
    function (textoLido) { aoLerCodigo(textoLido); },
    function () {}
  ).catch(function () {
    document.getElementById('avisoErro').style.display = 'block';
  });
</script>
</body>
</html>
